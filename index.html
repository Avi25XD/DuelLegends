<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stick Duel Arena</title>

<style>
/* Layout: one 16:9 arena canvas; menus, lobby and touch pad are DOM layers sized in cqw so everything scales with the arena. Single dark look on purpose. */
:root{--bg:#0b0e17;--panel:#151a29;--panel2:#1d2438;--line:#2c3550;--fg:#eef1fb;--mute:#8f9bbd;--hot:#ff5a3c;--ice:#39d4ff;--gold:#ffd23f;
--p1:#ff5a3c;--p2:#39d4ff;--p3:#7dff6a;--p4:#c77dff;
--display:'Russo One','Impact',sans-serif;--body:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:600;
padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:relative;container-type:inline-size;background:#000;overflow:hidden;box-shadow:0 0 0 2px #ffffff14,0 24px 70px #000c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ui{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;text-align:center;
background:radial-gradient(ellipse at 50% 40%,#0b0e1766,#0b0e17ee)}
.screen[hidden]{display:none}
h1{font-family:var(--display);font-weight:400;font-size:8cqw;line-height:.9;margin:0;letter-spacing:.2cqw;color:var(--fg);text-shadow:.5cqw .5cqw 0 var(--hot),1cqw 1cqw 0 #0b0e17}
h2{font-family:var(--display);font-weight:400;font-size:3cqw;margin:0;letter-spacing:.1cqw}
.sub{font-size:1.9cqw;color:var(--mute);letter-spacing:.1cqw}
.lab{font-size:1.3cqw;color:var(--mute);letter-spacing:.25cqw;text-transform:uppercase;min-width:7cqw;text-align:right}
.row{display:flex;align-items:center;gap:.7cqw;flex-wrap:wrap;justify-content:center}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--display);font-size:2cqw;padding:.8cqw 2.8cqw;background:var(--hot);color:#fff;border-radius:.4cqw;
box-shadow:0 .4cqw 0 #8d2a15;letter-spacing:.1cqw;transition:transform .08s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(.3cqw);box-shadow:0 .1cqw 0 #8d2a15}
.btn.alt{background:var(--panel2);box-shadow:0 .4cqw 0 #080b14,inset 0 0 0 .15cqw var(--line)}
.btn.sm{font-size:1.4cqw;padding:.5cqw 1.4cqw}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font-size:1.3cqw;font-weight:700;padding:.3cqw .9cqw;border-radius:99cqw;background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 .13cqw var(--line);letter-spacing:.05cqw}
.chip[aria-pressed=true]{background:var(--ice);color:#04222c;box-shadow:0 0 1.2cqw #39d4ff66}
.sw{all:unset;box-sizing:border-box;cursor:pointer;width:2.2cqw;height:2.2cqw;border-radius:50%;box-shadow:inset 0 0 0 .2cqw #0008}
.sw[aria-pressed=true]{box-shadow:0 0 0 .3cqw var(--fg),inset 0 0 0 .2cqw #0008}
button:focus-visible,input:focus-visible{outline:.25cqw solid var(--gold);outline-offset:.2cqw}
input.txt{all:unset;box-sizing:border-box;font-family:var(--body);font-weight:700;font-size:1.9cqw;background:var(--panel2);color:var(--fg);padding:.5cqw 1.2cqw;border-radius:.4cqw;box-shadow:inset 0 0 0 .15cqw var(--line);width:16cqw;text-align:center;text-transform:uppercase}
.panel{background:var(--panel);border-radius:.8cqw;padding:1cqw 1.6cqw;max-width:86cqw;box-shadow:inset 0 0 0 .15cqw var(--line);display:flex;flex-direction:column;gap:.9cqw;align-items:center}
.tiles{display:flex;gap:.6cqw;flex-wrap:wrap;justify-content:center;max-width:70cqw}
.slot{width:16cqw;min-height:11cqw;background:var(--panel);border-radius:.7cqw;box-shadow:inset 0 0 0 .2cqw var(--line);display:flex;flex-direction:column;align-items:center;gap:.3cqw;padding:.6cqw;font-size:1.5cqw}
.slot canvas{width:7cqw;height:8cqw}
.slot.me{box-shadow:inset 0 0 0 .25cqw var(--gold)}
.slot .st{font-size:1.2cqw;color:var(--mute);letter-spacing:.15cqw}
.slot .st.ok{color:var(--p3)}
.code{font-family:var(--display);font-size:5cqw;letter-spacing:.9cqw;color:var(--gold);text-shadow:0 0 2cqw #ffd23f55}
.note{font-size:1.35cqw;color:var(--mute);max-width:60cqw;line-height:1.25}
#pad{position:absolute;inset:0;display:none;pointer-events:none}
#pad.show{display:block}
#pad button{all:unset;pointer-events:auto;touch-action:none;box-sizing:border-box;position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;
background:#ffffff22;box-shadow:inset 0 0 0 .25cqw #ffffff55,0 .4cqw 1.2cqw #0006;color:var(--fg);font-family:var(--display);font-size:1.7cqw;letter-spacing:.05cqw}
#pad button.on{background:#ffd23fcc;color:#1a1200;transform:scale(.94)}
#pad .a{right:3cqw;bottom:3cqw;width:14cqw;height:14cqw;background:#ff5a3c77;font-size:2.3cqw}
#pad .b{right:19cqw;bottom:3.5cqw;width:10.5cqw;height:10.5cqw;background:#39d4ff55}
#pad .j{right:6.5cqw;bottom:19cqw;width:11cqw;height:11cqw;background:#7dff6a55}
#pad .p{left:50%;bottom:1.4cqw;margin-left:-2.4cqw;width:4.8cqw;height:4.8cqw;font-size:1.3cqw}
#joy{pointer-events:auto;touch-action:none;position:absolute;left:0;top:11cqw;bottom:0;width:50%}
#joy .base{position:absolute;width:13cqw;height:13cqw;margin:-6.5cqw 0 0 -6.5cqw;border-radius:50%;background:#ffffff14;box-shadow:inset 0 0 0 .25cqw #ffffff44;display:none}
#joy .knob{position:absolute;width:6.4cqw;height:6.4cqw;margin:-3.2cqw 0 0 -3.2cqw;border-radius:50%;background:#ffffff66;box-shadow:0 0 1.5cqw #0008;display:none}
#joy .hint{position:absolute;left:5cqw;bottom:4cqw;width:13cqw;height:13cqw;border-radius:50%;box-shadow:inset 0 0 0 .22cqw #ffffff33;background:#ffffff0d;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:1.3cqw;line-height:1.3;color:#ffffffa0;pointer-events:none}
#joy.act .hint{display:none}#joy.act .base,#joy.act .knob{display:block}
.screen{overflow-y:auto;justify-content:safe center}
.custom{display:flex;gap:1.6cqw;align-items:stretch;justify-content:center;flex-wrap:nowrap}
.pv{width:23cqw;flex:none}.pvc{width:20cqw;height:22.7cqw;display:block}
.pk{width:58cqw;align-items:stretch;flex:none}
.pick{min-height:23cqw;width:100%;display:flex;flex-direction:column;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.6cqw;width:100%}
.grid.g4{grid-template-columns:repeat(4,1fr);max-width:40cqw;margin:0 auto}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2cqw;padding:.3cqw;background:var(--panel2);border-radius:.5cqw;box-shadow:inset 0 0 0 .13cqw var(--line);font-size:.95cqw;color:var(--mute);letter-spacing:.08cqw;min-width:0}
.tile canvas{width:100%;aspect-ratio:1;border-radius:.4cqw;display:block}
.tile[aria-pressed=true]{box-shadow:inset 0 0 0 .25cqw var(--gold);color:var(--fg)}
@media (pointer:coarse){.chip{font-size:1.8cqw;padding:.5cqw 1.2cqw}.lab{font-size:1.4cqw}.btn{font-size:2.3cqw}.btn.sm{font-size:1.7cqw}.sw{width:3cqw;height:3cqw}.tile{font-size:1.05cqw}.note{font-size:1.5cqw}.slot{font-size:1.7cqw}.panel{gap:.9cqw}h2{font-size:2.6cqw}}
#rot{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-size:20px}
#rot b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--gold)}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

  </div>
</div>
<script>
(()=>{
'use strict';
const W=960,H=540,TAU=Math.PI*2;
const $=(s,r)=>(r||document).querySelector(s);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const PCOL=['#ff5a3c','#39d4ff','#7dff6a','#c77dff'];
let R=1;

/* ---------- cosmetics ---------- */
const COLS=['#ff5a3c','#39d4ff','#7dff6a','#c77dff','#ffd23f','#ff7ac8','#ffffff','#ff9a3c','#2fe0b0','#5a7dff','#b8c0d8','#222834','#a0ff3a','#8a5a3c','#f2c9a0','#ff3a7a'];
const HATS=['none','cap','tophat','crown','headband','horns','halo','helmet','antenna','wizard','mohawk','cowboy','viking','chef','bunny','pirate','party','afro','laurel'];
const EYES=['dot','angry','cool','cyclops','sleepy','happy','wink'];
const CAPES=['NONE','SCARF','CAPE','WINGS'],AURAS=['NONE','GLOW','FLAME','SPARKLE'];
const THICK=[3.2,4.4,6];
const THN=['SLIM','NORMAL','CHUNKY'];
const defLook=i=>({n:'DUELIST',c:i%12,a:(i+4)%12,h:[1,3,5,4][i%4],e:[1,2,0,3][i%4],t:1,cp:0,au:0});
function loadLook(){try{const s=JSON.parse(localStorage.getItem('sda-look')||'null');if(s&&typeof s.c==='number')return Object.assign(defLook(0),s)}catch(e){}return defLook(0)}
function saveLook(l){try{localStorage.setItem('sda-look',JSON.stringify(l))}catch(e){}}
const cleanName=s=>String(s||'').replace(/[^A-Za-z0-9 ]/g,'').slice(0,10).toUpperCase()||'DUELIST';
function sanitizeLook(l){
  l=l||{};const n=(v,m,d)=>Number.isInteger(v)&&v>=0&&v<m?v:d;
  return{n:cleanName(l.n),c:n(l.c,COLS.length,0),a:n(l.a,COLS.length,4),h:n(l.h,HATS.length,0),e:n(l.e,EYES.length,0),t:n(l.t,3,1),cp:n(l.cp,4,0),au:n(l.au,4,0)};
}

/* ---------- weapons ---------- */
/* type: melee | gun | throw. cd/frames. sk = skill id, skcd = skill cooldown frames */
const WP={
 fists:{name:'FISTS',type:'melee',dmg:7,cd:16,reach:46,kb:5,col:'#e8e8f0',sk:'upper',skn:'Uppercut',skcd:70,d:'Reliable. Skill launches you upward with a hit.'},
 katana:{name:'KATANA',type:'melee',dmg:13,cd:20,reach:72,kb:7,col:'#cfe9ff',sk:'dash',skn:'Dash Slash',skcd:80,d:'Swings deflect bullets. Skill lunges forward through foes.'},
 spear:{name:'SPEAR',type:'melee',dmg:11,cd:24,reach:104,kb:7,col:'#d9c08a',sk:'vault',skn:'Pole Vault',skcd:70,d:'Longest reach. Skill vaults you high.'},
 hammer:{name:'HAMMER',type:'melee',dmg:20,cd:42,reach:58,kb:13,col:'#9aa4c0',sk:'slam',skn:'Ground Slam',skcd:110,d:'Slow and brutal. Skill sends shockwaves both ways.'},
 pistol:{name:'PISTOL',type:'gun',dmg:9,cd:16,ammo:14,spd:15,spread:.03,kb:3,life:55,col:'#c8ccd8',sk:'roll',skn:'Dodge Roll',skcd:80,d:'Accurate. Skill is an invincible roll.'},
 ak47:{name:'AK-47',type:'gun',dmg:6,cd:6,ammo:30,spd:16,spread:.09,kb:1.6,life:50,recoil:.5,col:'#b08a5a',sk:'burst',skn:'Spray',skcd:120,d:'Full auto. Skill dumps a fast burst.'},
 shotgun:{name:'SHOTGUN',type:'gun',dmg:5,cd:38,ammo:6,spd:14,spread:.2,pellets:7,kb:3,life:24,recoil:3,col:'#8a6a4a',sk:'boomjump',skn:'Blast Jump',skcd:90,d:'Close range. Skill blasts you into the air.'},
 sniper:{name:'SNIPER',type:'gun',dmg:34,cd:60,ammo:5,spd:28,spread:0,kb:9,life:60,pierce:1,col:'#6a8a6a',sk:'scope',skn:'Deadeye',skcd:140,d:'Piercing shot. Skill makes the next one huge.'},
 rpg:{name:'RPG',type:'gun',dmg:0,cd:70,ammo:3,spd:9,spread:0,kb:0,life:90,grav:.02,boom:78,bdmg:34,bkb:13,recoil:3,col:'#7a8a4a',sk:'rocketjump',skn:'Rocket Jump',skcd:100,d:'Explosive. Skill fires at your feet to launch you.'},
 grenade:{name:'GRENADE',type:'throw',dmg:0,cd:46,ammo:4,spd:9,grav:.4,bounce:.55,fuse:70,boom:70,bdmg:28,bkb:11,col:'#6a8a4a',sk:'cluster',skn:'Cluster',skcd:130,d:'Bounces then blows. Skill throws three.'},
 aloo:{name:'ALOO',type:'throw',dmg:8,cd:22,ammo:9,spd:10,grav:.34,bounce:.6,fuse:80,boom:44,bdmg:10,bkb:6,col:'#d8b070',sk:'masala',skn:'Aloo Barrage',skcd:100,d:'A thrown potato that bounces and pops. Skill fans three.'},
 boomerang:{name:'BOOMERANG',type:'throw',dmg:10,cd:34,ammo:99,spd:11,boom_ret:1,kb:6,life:70,col:'#ffb347',sk:'whirl',skn:'Whirl',skcd:90,d:'Flies out and returns. Skill spins a damaging ring.'},
 icegun:{name:'FROST GUN',type:'gun',dmg:4,cd:12,ammo:24,spd:12,spread:.05,kb:1,life:50,slow:90,col:'#7fe6ff',sk:'freeze',skn:'Deep Freeze',skcd:150,d:'Chills targets. Skill flash-freezes nearby foes.'},
 bow:{name:'BOW',type:'gun',dmg:14,cd:30,ammo:12,spd:19,spread:.01,kb:5,life:70,grav:.12,col:'#c8a070',sk:'multi',skn:'Triple Shot',skcd:100,d:'Arrows arc a little. Skill fires three.'}
};
const WIDS=Object.keys(WP).filter(k=>k!=='fists');

/* ---------- audio ---------- */
let AC=null,master=null,NB=null,muted=false;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.6;master.connect(AC.destination);
    const len=AC.sampleRate*.5|0;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}catch(e){AC=null}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.03);
}
function noise(dur,vol,hp,delay){
  if(!AC||muted)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*.15);s.stop(t+dur+.03);
}
const SFX={
 swing(){noise(.1,.18,1800)},hit(){noise(.08,.5,900);tone(180,60,.1,'square',.2)},slash(){noise(.12,.3,3000);tone(1400,500,.1,'triangle',.1)},
 pistol(){noise(.08,.5,1200);tone(300,70,.1,'square',.2)},ak(){noise(.06,.4,1500);tone(240,80,.07,'sawtooth',.15)},
 shot(){noise(.25,.7,500);tone(150,40,.2,'sawtooth',.3)},snipe(){noise(.3,.6,700);tone(500,60,.3,'sawtooth',.25)},
 boom(){noise(.6,.9,100);tone(110,30,.5,'sawtooth',.5)},thud(){tone(90,35,.18,'sine',.4);noise(.08,.2,200)},
 jump(){tone(260,620,.12,'sine',.1)},pick(){tone(520,1040,.12,'square',.12);tone(780,1560,.1,'square',.1,.08)},
 ko(){tone(240,40,.6,'sawtooth',.3);noise(.4,.4,200)},ui(){tone(600,900,.06,'square',.08)},ice(){tone(1800,900,.25,'sine',.15);noise(.2,.2,4000)},
 aloo(){tone(140,90,.08,'sine',.3);tone(300,200,.06,'triangle',.15)},bell(){tone(880,880,.5,'sine',.2);tone(1320,1320,.5,'sine',.08)},
 whoosh(){noise(.18,.2,1200);tone(200,500,.15,'sine',.1)}
};

/* ---------- maps ---------- */
function sky(g,a,b){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function glowDot(g,x,y,r,col){const q=g.createRadialGradient(x,y,1,x,y,r);q.addColorStop(0,col);q.addColorStop(1,col.slice(0,7)+'00');g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)}
function stars(g,n,seed,maxY){const r=rng(seed);g.fillStyle='#fff';for(let i=0;i<n;i++){g.globalAlpha=.3+r()*.7;g.fillRect(r()*W,r()*maxY,1.6,1.6)}g.globalAlpha=1}
function ridge(g,col,base,amp,fq,seed,off){const r=rng(seed);g.fillStyle=col;g.beginPath();g.moveTo(0,H);const p=r()*9;for(let x=0;x<=W;x+=12)g.lineTo(x,base-Math.abs(Math.sin(x*fq+p))*amp-Math.sin(x*fq*2.3+p*2)*amp*.3-(off||0));g.lineTo(W,H);g.fill()}
const MAPS=[
{name:'NEON ROOFTOPS',g:.62,fr:.8,pc:['#1b2140','#39d4ff'],
 plats:[[0,470,350,80,'s'],[610,470,350,80,'s'],[390,380,180,16,'o'],[110,350,150,16,'o'],[700,350,150,16,'o'],[440,262,80,16,'s']],
 spawns:[[90,470],[870,470],[300,470],[660,470]],
 bg(g){sky(g,'#07061a','#3a1650');stars(g,60,3,220);glowDot(g,730,130,160,'#ff4fa3aa');g.fillStyle='#fdf0ff';g.beginPath();g.arc(730,130,34,0,TAU);g.fill();
  const r=rng(9);for(let k=0;k<2;k++){g.fillStyle=k?'#0f0c2a':'#1a1240';for(let x=-20;x<W;){const w=40+r()*70,h=(k?120:200)+r()*160;g.fillRect(x,H-h-60,w,h+60);
    for(let wy=H-h-48;wy<H-90;wy+=18)for(let wx=x+6;wx<x+w-8;wx+=14)if(r()<.35){g.fillStyle=r()<.5?'#39d4ff':'#ff4fa3';g.globalAlpha=.8;g.fillRect(wx,wy,5,8);g.globalAlpha=1}g.fillStyle=k?'#0f0c2a':'#1a1240';x+=w+4}}},
 dyn(g,t){g.globalAlpha=.5+.3*Math.sin(t*.05);g.fillStyle='#ff4fa3';g.fillRect(40,100,6,26);g.fillStyle='#39d4ff';g.fillRect(880,160,6,26);g.globalAlpha=1}},
{name:'FROZEN PEAKS',g:.62,fr:.97,pc:['#6a88b0','#e8fbff'],
 plats:[[0,480,960,60,'s'],[200,390,150,18,'s'],[610,390,150,18,'s'],[400,300,160,16,'o'],[60,300,120,16,'o'],[780,300,120,16,'o']],

/* ---------- projectiles ---------- */
function addProj(s,mine){
  const w=WP[s.k]||WP.pistol,big=s.v===1;
  const p={id:s.id,o:s.o,k:s.k,x:s.x,y:s.y,vx:s.vx,vy:s.vy,mine,life:w.fuse||w.life||60,g:w.grav||0,dmg:big?w.dmg*2.2:w.dmg,kb:w.kb||0,pierce:!!w.pierce||big,boom:w.boom||0,bdmg:w.bdmg||0,bkb:w.bkb||0,

}
function fireProj(f,k,ang,extra){
  const w=WP[k],sp=w.spd*(extra&&extra.sp||1),a=ang+(rnd(-1,1)*(w.spread||0));
  const s={id:f.id+'.'+(uid++),o:f.id,k,x:f.x+f.face*Math.cos(ang)*18,y:f.y-34+Math.sin(ang)*14,vx:Math.cos(a)*sp*f.face,vy:Math.sin(a)*sp,v:(extra&&extra.v)||0};
  addProj(s,true);send('proj',s);return s;
}
function explode(p){
  if(p.done)return;p.done=true;
  const e={x:p.x,y:p.y,r:p.boom,dmg:p.bdmg,kb:p.bkb,o:p.o};
  send('boom',e);G.proj=G.proj.filter(q=>q!==p);
}
function onBoom(e,local){
  G.shake=Math.max(G.shake,e.r>60?14:7);ring(e.x,e.y,e.r,'#ffb347');ring(e.x,e.y,e.r*.6,'#fff3c0');spark(e.x,e.y,'#ffb347',20);spark(e.x,e.y,'#fff',8);puff(e.x,e.y+6,8,'#555a6a');SFX.boom();
  G.flash=Math.max(G.flash,e.r>60?5:2);
  for(const f of G.fighters){if(!f.own||!f.alive)continue;
    const dx=f.x-e.x,dy=(f.y-28)-e.y,d=Math.hypot(dx,dy);if(d>e.r+10)continue;
    const fall=1-cl(d/(e.r+10)),n=d||1,self=f.id===e.o;
    const dm=e.dmg*(self?.35:1)*(.4+.6*fall);
    if(f.inv>0)continue;
    f.vx=dx/n*e.kb*(.5+fall);f.vy=dy/n*e.kb*(.5+fall)-3;f.onG=false;
    if(dm>0)hurt(f,dm,f.vx,f.vy,e.o);
  }
}
function updProj(){
  const dead=[];
  for(const p of G.proj){
    p.t++;p.life--;p.rot+=.3;
    if(p.k==='aloo'||p.k==='grenade'||p.k==='boomerang')p.rot+=.2;
    if(p.ret){
      /* boomerang: slows, then returns to owner */
      const ow=fById(p.o);
      if(p.t<22){p.vx*=.96}
      else if(ow){const dx=ow.x-p.x,dy=ow.y-34-p.y,d=Math.hypot(dx,dy)||1,sp=Math.min(13,6+(p.t-22)*.4);p.vx=lerp(p.vx,dx/d*sp,.2);p.vy=lerp(p.vy,dy/d*sp,.2);if(d<20&&p.t>30){dead.push(p);if(ow.own)ow.ammo=99;continue}}
      if(p.t>180)dead.push(p);
    }
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;
    if(p.life<=0){if(p.boom){if(p.mine)explode(p);else{p.vx=p.vy=0;p.g=0;if(p.life<-30)dead.push(p)}}else if(!p.ret)dead.push(p);continue}
    if(p.x<-100||p.x>W+100||p.y>H+120||p.y<-300){dead.push(p);continue}
    /* terrain */
    let hitT=null;
    if(!p.ret)for(const pl of MP.plats){const[x,y,w,h,t]=pl;if(p.x>x&&p.x<x+w&&p.y>y&&p.y<y+h){if(t==='o'&&!p.bounce&&!p.boom)continue;hitT=pl;break}}
    if(hitT&&!p.ret){
      if(p.bounce){const[x,y,w,h]=hitT;const px=p.x-p.vx,py=p.y-p.vy;
        if(py<=y+2){p.y=y-1;p.vy=-Math.abs(p.vy)*p.bounce;p.vx*=.82;if(Math.abs(p.vy)<1.2)p.vy=0}
        else if(px<=x){p.x=x-1;p.vx=-Math.abs(p.vx)*p.bounce}else if(px>=x+w){p.x=x+w+1;p.vx=Math.abs(p.vx)*p.bounce}else{p.y=y+h+1;p.vy=Math.abs(p.vy)*p.bounce}
        if(p.t%3===0)SFX.aloo();}
      else if(p.boom){if(p.mine)explode(p);else{p.vx=p.vy=0;p.g=0}continue}
      else{spark(p.x,p.y,'#ffe9a0',4);dead.push(p);continue}
    }
    /* fighters */
    for(const f of G.fighters){
      if(!f.alive||f.id===p.o||p.hit[f.id]||f.inv>0)continue;const b=hbox(f);
      if(p.x>b.x0-p.r&&p.x<b.x1+p.r&&p.y>b.y0-4&&p.y<b.y1){
        if(p.boom){if(p.mine)explode(p);else{p.vx=p.vy=0;p.g=0}break}
        if(p.bounce&&!p.dmg)continue;
        p.hit[f.id]=1;
        if(f.own)hurt(f,p.dmg,Math.sign(p.vx||1)*p.kb,-p.kb*.45,p.o,{slow:p.slow});
        else spark(p.x,p.y,'#fff',5);
        if(p.bounce){p.vx*=-.3;p.vy=-3}else if(!p.pierce&&!p.ret){dead.push(p)}
        break;
      }
    }
  }
  if(dead.length)G.proj=G.proj.filter(p=>!dead.includes(p));
}

function melee(f,w,o){

  const s={o:f.id,x:f.x,y:f.y,f:f.face,r:reach,dmg,kb,up:o.up||0,w:w===WP.fists?'fists':f.wpn,defl:o.defl?1:0};
  doMelee(s,true);send('melee',s);

function doMelee(s,local){
  const x0=s.x,x1=s.x+s.f*s.r,lo=Math.min(x0,x1)-8,hi=Math.max(x0,x1)+8;
  if(s.w==='katana'||s.defl){

function canAct(f){return f.alive&&f.stun<=0&&f.freeze<=0&&G.phase==='fight'}

function attack(f){

  if(w.type==='melee'){
    SFX[f.wpn==='katana'||f.wpn==='spear'?'slash':'swing']();
    melee(f,w,{defl:f.wpn==='katana'});f.vx+=f.face*1.2;

  }else{

      if(f.scope>0){f.scope=0}
      f.vx-=f.face*(w.recoil||0);
      SFX[f.wpn==='ak47'||f.wpn==='icegun'?'ak':f.wpn==='pistol'||f.wpn==='bow'?'pistol':f.wpn==='sniper'?'snipe':'shot']();
      spark(f.x+f.face*24,f.y-34,'#ffd27a',3);
    }else{
      fireProj(f,f.wpn,a-.35,{sp:1});if(f.wpn==='boomerang'){}SFX.whoosh()}
    f.ammo--;if(f.ammo<=0&&f.wpn!=='boomerang'){ftext(f.x,f.y-76,'EMPTY','#ff7a5a');f.wpn='fists';f.ammo=0}
  }
}

/* ---------- fighter physics ---------- */
const AUTO={ak47:1,icegun:1};
function land(f,y,t){

function stepFighter(f){
  f.anim++;

  if(f.atk>0&&++f.atk>14)f.atk=0;
  const m=MP,i=f.inp,p=f.pr;
  if(!f.alive){
    f.deadT++;f.vy=Math.min(14,f.vy+m.g);f.x+=f.vx;const py=f.y;f.y+=f.vy;f.vx*=.99;f.rot+=f.spin;
    for(const[x,y,w]of m.plats){if(f.x>x&&f.x<x+w&&py<=y+1&&f.y>=y&&f.vy>0){f.y=y;f.vy=-f.vy*.35;f.spin*=.6;f.vx*=.7}}
    return;
  }
  f.aim=aimAng(f);
  const can=f.stun<=0&&f.freeze<=0&&G.phase==='fight'&&f.roll<=0;
  const dir=(i.r?1:0)-(i.l?1:0);
  if(can){
    const slow=f.slow>0,acc=(slow?.45:1)*(f.onG?1:.6),max=4.4*(slow?.55:1);
    if(dir){f.vx+=dir*acc;f.face=dir;if(Math.abs(f.vx)>max)f.vx*=.9}
    else f.vx*=f.onG?m.fr:.97;
    if(i.u&&!p.u&&f.jumps>0){f.vy=-(f.onG?11.8:10.6)*Math.sqrt(m.g/.62);f.jumps--;f.onG=false;SFX.jump();if(f.jumps===0)puff(f.x,f.y,3)}
    if(i.d&&!p.d&&f.onG&&f.standOn==='o'&&!i.a)f.dropT=14;
    if(i.a&&(!p.a||AUTO[f.wpn]))attack(f);
    if(i.b&&!p.b)skill(f);
    if(f.burst>0&&G.tick%3===0&&f.ammo>0){fireProj(f,f.wpn,aimAng(f));f.ammo--;f.burst--;SFX.ak();f.atk=1}else if(f.burst>0&&f.ammo<=0)f.burst=0;
  }else{f.vx*=f.roll>0?.94:.97}
  p.a=i.a;p.b=i.b;p.u=i.u;p.d=i.d;
  f.vy=Math.min(14,f.vy+m.g);
  f.x+=f.vx;
  for(const[x,y,w,h,t]of m.plats){if(t!=='s')continue;
    if(f.x+9>x&&f.x-9<x+w&&f.y>y+3&&f.y-56<y+h){if(f.vx>0)f.x=x-9;else if(f.vx<0)f.x=x+w+9;f.vx=0}}
  const py=f.y;f.y+=f.vy;f.onG=false;f.standOn=null;
  for(const[x,y,w,h,t]of m.plats){
    if(!(f.x+8>x&&f.x-8<x+w))continue;
    if(t==='s'){if(f.vy>=0&&py<=y+1&&f.y>=y)land(f,y,'s');else if(f.vy<0&&py-56>=y+h-1&&f.y-56<y+h){f.y=y+h+56;f.vy=0}}
    else if(f.vy>=0&&py<=y+1&&f.y>=y&&f.dropT<=0)land(f,y,'o');
  }
  if(!f.onG&&f.jumps===2)f.jumps=1;
  if(f.y>H+90||f.x<-90||f.x>W+90||(m.lava&&f.y>m.lava+8)){if(m.lava&&f.y>m.lava+8){spark(f.x,m.lava,'#ffb347',16);puff(f.x,m.lava,6,'#ff8a3c')}f.lastT=G.tick<f.lastT?f.lastT:f.lastT;killF(f)}
}
function stepRemote(f){
  f.anim++;if(f.flash>0)f.flash--;
  if(f.tx!==undefined&&f.alive){f.x=Math.abs(f.tx-f.x)>140?f.tx:lerp(f.x,f.tx,.35);f.y=Math.abs(f.ty-f.y)>140?f.ty:lerp(f.y,f.ty,.35)}
  if(!f.alive){f.deadT++;f.vy=Math.min(14,f.vy+MP.g);f.x+=f.vx;f.y+=f.vy;f.rot+=f.spin;f.vx*=.99}

/* ---------- bots ---------- */
function groundAt(x,y){for(const[px,py,w]of MP.plats)if(x>px&&x<px+w&&py>=y-6&&py<y+170)return true;return false}
function aiThink(f){
  const a=f.ai,i=f.inp;i.l=i.r=i.u=i.d=i.a=i.b=0;
  if(!f.alive||G.phase!=='fight')return;
  const en=G.fighters.filter(q=>q.alive&&q.id!==f.id);if(!en.length)return;
  if(--a.t<=0||!a.tgt||!a.tgt.alive){a.t=14+rnd(26)|0;let b=1e9;for(const q of en){const d=Math.abs(q.x-f.x)+Math.abs(q.y-f.y)*.6;if(d<b){b=d;a.tgt=q}}a.jit=rnd(-1,1)}
  const t=a.tgt,dx=t.x-f.x,dy=t.y-f.y,ad=Math.abs(dx),w=WP[f.wpn],dir=dx>0?1:-1;
  const range=w.type==='melee'?w.reach*.75:w.type==='gun'?250+a.jit*40:200;
  let mv=0;
  if(ad>range)mv=dir;else if(w.type!=='melee'&&ad<80)mv=-dir;
  if(f.wpn==='fists'||f.ammo<=0&&w.ammo){let bc=null,bd=1e9;for(const c of G.crates){const d=Math.abs(c.x-f.x)+Math.abs(c.y-f.y);if(d<bd){bd=d;bc=c}}if(bc&&bd<500){mv=bc.x>f.x?1:-1;if(bc.y<f.y-60&&f.onG&&rnd()<.05)i.u=1}}
  if(mv&&f.onG&&!groundAt(f.x+mv*34,f.y)&&f.jumps>0)i.u=1;
  if(f.y>H-60||f.x<10||f.x>W-10){mv=f.x<W/2?1:-1;if(f.vy>2&&f.jumps>0&&rnd()<.5)i.u=1}
  if(dy<-80&&f.onG&&rnd()<.03)i.u=1;
  if(mv>0)i.r=1;else if(mv<0)i.l=1;
  const facing=(t.x>f.x)===(f.face>0);
  if(Math.abs(dy)<90&&ad<range+50&&facing&&f.cd<=0&&rnd()<.35)i.a=1;
  if(Math.abs(dy)>50&&Math.abs(dy)<160&&ad<120&&dy<0)i.u=rnd()<.2?1:i.u;
  if(f.skcd<=0&&ad<range*1.3&&facing&&rnd()<.018)i.b=1;
  if(ad>8&&!mv&&f.stun<=0)f.face=dir;
}

/* ---------- round flow ---------- */
function spawnFor(slot){const s=MP.spawns[slot%MP.spawns.length];return s}
function applyRound(d){
  MP=MAPS[d.map];G.map=d.map;G.round=d.round;G.phase='intro';G.pt=0;G.proj.length=0;G.crates.length=0;G.parts.length=0;G.texts.length=0;G.winner=null;G.banner=null;G.over=false;
  G.fighters.forEach((f,idx)=>{
    const s=spawnFor(f.slot);Object.assign(f,{x:s[0],y:s[1],vx:0,vy:0,tx:s[0],ty:s[1],hp:100,alive:true,face:s[0]<W/2?1:-1,cd:0,skcd:0,stun:0,slow:0,freeze:0,inv:0,flash:0,atk:0,rot:0,spin:0,burst:0,scope:0,roll:0,deadT:0,lastBy:null,jumps:2,onG:false});
    f.wpn=d.w[idx]||'fists';f.ammo=WP[f.wpn].ammo||99;
  });
  SFX.bell();
}
function hostStartRound(round){
  const m=G.cfg.map<0?(Math.random()*MAPS.length|0):G.cfg.map;
  const w=G.fighters.map(()=>G.cfg.weapons==='random'?pick(WIDS):G.cfg.weapons==='fists'?'fists':G.cfg.weapons);
  send('start',{map:m,round,w,ids:round===1&&G.online?G.fighters.map(f=>f.id):undefined});
}
function newMatch(){
  G.fighters.forEach(f=>{f.wins=0;f.kills=0});G.over=false;G.target=G.cfg.target;
  if(G.host)hostStartRound(1);
}
function stepGame(){
  G.tick++;
  if(G.hs>0){G.hs--;return}
  G.shake*=.86;if(G.shake<.3)G.shake=0;if(G.flash>0)G.flash--;
  for(const f of G.fighters){if(f.own){if(f.bot)aiThink(f);stepFighter(f)}else stepRemote(f)}
  /* separate pushy overlap a little */
  for(const a of G.fighters)for(const b of G.fighters){if(a.id>=b.id||!a.alive||!b.alive||!a.own||!b.own)continue;
    if(Math.abs(a.x-b.x)<14&&Math.abs(a.y-b.y)<40){const d=a.x<b.x?-1:1;a.vx+=d*.5;b.vx-=d*.5}}
  updProj();updCrates();
  for(const p of G.parts){p.life--;if(p.k==='d'){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.97}else if(p.k==='s'){p.x+=p.vx;p.y+=p.vy;p.r*=1.02}}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.life--;t.y-=.5}G.texts=G.texts.filter(t=>t.life>0);
  if(G.phase==='intro'){G.pt++;if(G.pt===70)SFX.bell();if(G.pt>=110){G.phase='fight';G.pt=0}}
  else if(G.phase==='fight'){
    G.pt++;
    if(G.host){
      const al=G.fighters.filter(f=>f.alive);
      if(G.fighters.length>=2&&al.length<=1&&G.pt>20){send('rend',{w:al[0]?al[0].id:null})}
      else if(G.cfg.crates&&G.pt%330===200){send('crate',{id:'c'+(uid++),x:rnd(120,W-120),w:pick(WIDS)})}
    }
  }else if(G.phase==='end'){
    G.pt++;
    if(G.host&&G.pt===170){
      const top=G.fighters.reduce((a,b)=>b.wins>a.wins?b:a,G.fighters[0]);
      if(top&&top.wins>=G.target)send('over',{w:top.id});else hostStartRound(G.round+1);
    }
  }
}
/* ---------- events (local + remote share one handler) ---------- */
function handle(t,d,local){
  if(!d)return;
  switch(t){
    case'proj':if(!local&&WP[d.k])addProj(d,false);break;
    case'melee':if(!local&&WP[d.w])doMelee(d,false);break;
    case'boom':onBoom(d,local);G.proj=G.proj.filter(q=>!(q.boom&&!q.mine&&q.o===d.o&&Math.hypot(q.x-d.x,q.y-d.y)<70));break;
    case'freeze':if(!local)onFreeze(d);break;
    case'die':onDie(d,local);break;
    case'crate':if(WP[d.w])addCrate(d);break;
    case'pick':if(!local){const c=G.crates.find(q=>q.id===d.id);if(c){c.dead=1;spark(c.x,c.y-10,'#7dff6a',8)}}break;
    case'start':if(MAPS[d.map])applyRound(d);break;
    case'rend':{if(G.phase==='end')break;G.phase='end';G.pt=0;G.winner=d.w;const w=fById(d.w);if(w){w.wins++;SFX.bell()}break}
    case'over':G.over=true;G.winner=d.w;if(G.onOver)G.onOver(d);break;
  }
}

const str=(v,n)=>typeof v==='string'&&v.length>0&&v.length<=n;

}
function refreshRole(){
  const ps=lobbyPeers();if(!ps.length)return;
  const me=ps.find(p=>p.isMe||p.sameTab);G.me=me?me.peer:G.me;G.host=!!(me&&ps[0].peer===me.peer);net.hostPeer=ps[0].peer;
}

function buildOnline(ids){
  const ps=lobbyPeers(),f=[];
  ids.slice(0,4).forEach((id,i)=>{
    const p=ps.find(q=>q.peer===id),look=sanitizeLook(p&&p.presence&&p.presence.l);
    while(f.some(q=>q.look.c===look.c))look.c=(look.c+1)%COLS.length;

function validMsg(t,d,m){

  switch(t){
    case'proj':return d.o===P&&WP[d.k]&&str(d.id,48)&&fin(d.x,-200,W+200)&&fin(d.y,-300,H+200)&&fin(d.vx,-40,40)&&fin(d.vy,-40,40)&&(d.v===0||d.v===1||d.v===undefined);
    case'melee':return d.o===P&&(d.w==='fists'||WP[d.w])&&fin(d.x,-200,W+200)&&fin(d.y,-300,H+200)&&(d.f===1||d.f===-1)&&fin(d.r,0,170)&&fin(d.dmg,0,30)&&fin(d.kb,0,16)&&(d.up===undefined||fin(d.up,0,9));
    case'boom':return d.o===P&&fin(d.x,-200,W+200)&&fin(d.y,-300,H+300)&&fin(d.r,0,100)&&fin(d.dmg,0,40)&&fin(d.kb,0,16);
    case'freeze':return d.o===P&&fin(d.x,-200,W+200)&&fin(d.y,-300,H+300)&&fin(d.r,0,120);
    case'die':return d.id===P&&(d.by===null||d.by===undefined||str(d.by,48));
    case'crate':return host&&str(d.id,24)&&fin(d.x,0,W)&&!!WP[d.w];
    case'pick':return d.by===P&&str(d.id,24);

function remoteMsg(t,m){

    if(d.ids){G.cfg.target=net.cfgTarget||G.cfg.target;buildOnline(d.ids)}

function applyPresence(){
  if(!net||G.mode!=='play')return;
  const ps=net.nr.peers();
  for(const f of G.fighters){
    if(f.own)continue;const p=ps.find(q=>q.peer===f.id);
    if(!p){if(f.alive){f.alive=false;f.deadT=0}continue}
    const s=p.presence||{};
    if(fin(s.x,-300,W+300)&&fin(s.y,-300,H+400)){f.tx=s.x;f.ty=s.y}
    if(fin(s.vx,-40,40))f.vx=s.vx;if(fin(s.vy,-40,40))f.vy=s.vy;if(s.f===1||s.f===-1)f.face=s.f;
    if(fin(s.h,0,100)){if(s.h<f.hp)f.flash=5;f.hp=s.h}
    if(typeof s.al==='boolean'&&s.al&&!f.alive&&G.phase!=='fight'){f.alive=true}
    if(typeof s.al==='boolean'&&!s.al&&f.alive){f.alive=false;f.deadT=0;f.spin=rnd(-.3,.3)}
    if(WP[s.w]&&s.w!==f.wpn){f.wpn=s.w}
    if(fin(s.am,0,99))f.ammo=s.am;
    if(fin(s.at,0,14)&&s.at>0&&f.atk===0)f.atk=1;
    if(fin(s.ab,-1,1))f.aim=s.ab;if(fin(s.fz,0,200))f.freeze=s.fz;if(fin(s.rl,0,30))f.roll=s.rl;
    if(fin(s.ro,-20,20)&&!f.alive)f.rot=s.ro;
    if(fin(s.wn,0,9))f.wins=Math.max(f.wins,0);
  }
}

}
async function goOnline(code){
  UI.go('connecting');
  try{roomNs=roomNs||await claude.use('room')}catch(e){roomNs=null}
  if(!roomNs){UI.error('Online play needs this page opened by a signed-in viewer with access. Share the page with your friends first.');return}
  let nr;try{nr=await roomNs.join('sda-'+code.toLowerCase())}catch(e){UI.error('Could not open the party ('+(e&&e.code||'error')+'). Try again.');return}
  if(net){try{net.nr.leave()}catch(e){}}
  net={nr,code,ok:true,hostPeer:null,un:[],cfgTarget:3};
  const me=lobbyLook();
  nr.presence({n:me.n,l:me,rd:0}).catch(()=>{});
  for(const t of TOPICS)net.un.push(nr.on(t,m=>remoteMsg(t,m),()=>{}));
  net.un.push(nr.onPeers(()=>{refreshRole();applyPresence();UI.lobbyTick()},e=>{net.ok=false}));
  net.un.push(nr.onConnection(ok=>{net.ok=ok;UI.lobbyTick()}));

}

function startLocal(){
  if(net)leaveOnline();

  const f=[];

    function refreshTab(){
      tabs.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===tab));content.innerHTML='';
      if(tab==='hat'){const g=el('div','grid');HATS.forEach((h,i)=>g.append(tile(h.toUpperCase(),k=>headTile(k,L,{h:i}),L.h===i,()=>{L.h=i})));content.append(g)}
      else if(tab==='eyes'){const g=el('div','grid g4');EYES.forEach((h,i)=>g.append(tile(h.toUpperCase(),k=>headTile(k,L,{e:i}),L.e===i,()=>{L.e=i})));content.append(g)}
      else if(tab==='color'){const g=el('div','panel');g.style.cssText='background:none;box-shadow:none;padding:0';g.append(swatches('Body','c'),swatches('Accent','a'),el('div','note','Accent colors the hat, cape, aura and trim.'));content.append(g)}
      else{const g=el('div','panel');g.style.cssText='background:none;box-shadow:none;padding:0';
        g.append(chipRow('Cape',CAPES,()=>L.cp,i=>L.cp=i),chipRow('Aura',AURAS,()=>L.au,i=>L.au=i),chipRow('Build',THN,()=>L.t,i=>L.t=i));content.append(g);UI.refresh()}
    }
    right.append(tabs,content);body.append(left,right);s.append(body);
    s.append(btn('SAVE',()=>{L.n=cleanName(inp.value);saveLook(L);if(net){net.nr.presence({n:L.n,l:Object.assign({},L)}).catch(()=>{});UI.go('lobby')}else UI.go('menu')}));
    refreshTab();
  }
  else if(name==='arsenal'){
    s.append(el('h2','','ARSENAL'));const g=el('div','');g.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:.6cqw 1.2cqw;max-width:88cqw;text-align:left';
    for(const k of['fists',...WIDS]){const w=WP[k];const c=el('div','');c.style.cssText='background:var(--panel);border-radius:.5cqw;padding:.5cqw .9cqw;box-shadow:inset 0 0 0 .12cqw var(--line)';
      c.innerHTML=`<div style="font-family:var(--display);font-size:1.4cqw;color:${w.col}">${w.name}</div><div style="font-size:1.25cqw;color:var(--ice)">K: ${w.skn}</div><div style="font-size:1.2cqw;color:var(--mute);line-height:1.15">${w.d}</div>`;g.append(c)}
    s.append(g,el('div','note','Crates drop random weapons. Guns run out of ammo, then you are back to fists.'),btn('BACK',()=>UI.go('menu'),'alt'));
  }
  else if(name==='online'){
    s.append(el('h2','','ONLINE PARTY'),el('div','sub','Make a party, share the code, up to 4 players.'));
    if(UI.err)s.append(el('div','note',UI.err));
    const p=el('div','panel');const r1=el('div','row');r1.append(btn('CREATE PARTY',()=>goOnline(genCode())));
    const r2=el('div','row');const inp=el('input','txt');inp.id='code';inp.maxLength=4;inp.placeholder='CODE';inp.setAttribute('aria-label','Party code');inp.oninput=()=>{inp.value=inp.value.replace(/[^A-Za-z0-9]/g,'').toUpperCase()};
    inp.onkeydown=e=>{if(e.key==='Enter')join.click()};const join=btn('JOIN',()=>{if(inp.value.length===4)goOnline(inp.value)},'alt');r2.append(inp,join);p.append(r1,r2);
    s.append(p,el('div','note','Friends must open this same page while signed in, with access given from the Share menu (Contributor or higher), so they can send moves in the room.'),btn('BACK',()=>UI.go('menu'),'alt'));
  }
  else if(name==='connecting'){s.append(el('h2','','OPENING PARTY...'))}
  else if(name==='lobby'){UI.sig='';buildLobby(s)}
  else if(name==='over'){buildOver(s)}
  show(s);UI.refresh();
};
const genCode=()=>{const a='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=a[Math.random()*a.length|0];return s};
function buildLobby(s){
  const ps=lobbyPeers().slice(0,4);
  s.append(el('div','sub','PARTY CODE'),el('div','code',net?net.code:''));
  const row=el('div','row');row.style.gap='1cqw';
  for(let i=0;i<4;i++){
    const p=ps[i],d=el('div','slot'+(p&&(p.isMe||p.sameTab)?' me':''));
    if(p){const l=sanitizeLook(p.presence&&p.presence.l);d.append(previewCanvas(previewFighter(l,i),70,80));
      const nm=el('div','');nm.textContent=l.n+(i===0?' (HOST)':'');nm.style.color=PCOL[i];d.append(nm);
      const rd=i===0||(p.presence&&p.presence.rd===1);d.append(el('div','st'+(rd?' ok':''),rd?'READY':'NOT READY'))}
    else{d.append(el('div','st','WAITING...'))}
    row.append(d);
  }
  s.append(row);
  const C=G.cfg;
  if(G.host){
    const p=el('div','panel');
    p.append(chipRow('Map',['RANDOM',...MAPS.map(m=>m.name)],()=>C.map+1,i=>{C.map=i-1;hostCfgPublish()}),
      chipRow('Weapons',['RANDOM','FISTS + CRATES'],()=>C.weapons==='random'?0:1,i=>{C.weapons=i?'fists':'random';hostCfgPublish()}),
      chipRow('Wins needed',['1','3','5','7'],()=>[1,3,5,7].indexOf(C.target),i=>{C.target=[1,3,5,7][i];hostCfgPublish()}),
      chipRow('Crates',['ON','OFF'],()=>C.crates?0:1,i=>{C.crates=!i;hostCfgPublish()}));s.append(p);
  }else{s.append(el('div','note','The host picks the map, weapons and rules. Mark yourself ready.'))}
  const r=el('div','row'),me=ps.find(p=>p.isMe||p.sameTab);
  if(G.host){const ok=ps.length>=2&&ps.slice(1).every(p=>p.presence&&p.presence.rd===1);const b=btn('START MATCH',hostStartOnline);b.disabled=!ok;r.append(b)}
  else{const on=me&&me.presence&&me.presence.rd===1;r.append(btn(on?'NOT READY':'READY',()=>{net&&net.nr.presence({rd:on?0:1}).catch(()=>{})}))}
  r.append(btn('LOOK',()=>UI.go('custom'),'alt'),btn('LEAVE',()=>{leaveOnline();UI.go('menu')},'alt'));s.append(r);
  if(net&&!net.ok)s.append(el('div','note','Reconnecting...'));
  if(!G.host)readHostCfg();UI.refresh();
}
UI.lobbyTick=()=>{
  if(UI.cur!=='lobby'||!net)return;
  const ps=lobbyPeers();const C=G.cfg;
  const sig=ps.map(p=>p.peer+':'+(p.presence&&p.presence.rd)+':'+JSON.stringify(p.presence&&p.presence.l)).join('|')+'|'+(G.host?1:0)+(net.ok?1:0)+(!G.host?JSON.stringify(ps[0]&&ps[0].presence&&ps[0].presence.cfg):'');
  if(sig===UI.sig)return;UI.sig=sig;const s=sec();buildLobby(s);show(s);
};
function buildOver(s){
  const w=fById(G.winner);s.append(el('div','sub','MATCH OVER'));const h=el('h1','',w?w.look.n+'<br>WINS':'DRAW');h.style.fontSize='6.4cqw';h.style.color=w?PCOL[w.slot%4]:'#fff';s.append(h);
  const t=el('div','panel');G.fighters.slice().sort((a,b)=>b.wins-a.wins).forEach(f=>{const r=el('div','row');r.style.cssText='gap:2.2cqw;font-size:1.9cqw';
    const n=el('span','');n.textContent=f.look.n;n.style.cssText='min-width:12cqw;text-align:left;color:'+PCOL[f.slot%4];r.append(n,el('span','','WINS '+f.wins),el('span','sub','KOs '+f.kills));t.append(r)});s.append(t);
  const r=el('div','row');
  if(G.online){if(G.host)r.append(btn('REMATCH',()=>{hostStartOnline()}));r.append(btn('BACK TO LOBBY',()=>{G.mode='menu';net&&net.nr.presence({rd:0}).catch(()=>{});UI.go('lobby')},'alt'))}
  else r.append(btn('REMATCH',()=>{startLocal()}),btn('MENU',()=>UI.go('menu'),'alt'));
  s.append(r);
}
G.onOver=()=>{if(G.demo)return;G.mode='menu';UI.go('over')};
/* pause */
function togglePause(){
  if(G.mode!=='play')return;
  const old=$('#pausescr');if(old){old.remove();G.paused=false;return}
  if(!G.online)G.paused=true;
  const s=el('section','screen');s.id='pausescr';s.append(el('h2','',G.online?'MENU':'PAUSED'));
  const r=el('div','row');r.append(btn('RESUME',togglePause),btn(muted?'SOUND OFF':'SOUND ON',()=>{muted=!muted;togglePause();togglePause()},'alt'),btn('QUIT',()=>{$('#pausescr')&&$('#pausescr').remove();G.paused=false;if(G.online){leaveOnline()}G.mode='menu';UI.go('menu')},'alt'));s.append(r);ui.append(s);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.mode==='play'&&!G.online&&!$('#pausescr'))togglePause()});

/* ---------- loop ---------- */
let last=0,acc=0;
function tick(){
  if(G.paused)return;
  if(G.mode==='play'){readInputs();stepGame();pushState()}
  else if(G.mode==='demo')stepGame();
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;while(acc>=16.667){acc-=16.667;tick()}
  $('#pad').classList.toggle('show',G.mode==='play'&&(COARSE||touchSeen));
  render();drawPreviews();
}
function resize(){
  const st=$('#stage'),cs=getComputedStyle(document.body);
  const aw=document.body.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=document.body.clientHeight;
  const w=Math.max(240,Math.min(aw,ah*16/9)),h=w*9/16;st.style.width=w+'px';st.style.height=h+'px';
  R=Math.round(Math.min(2,Math.max(1,w*(devicePixelRatio||1)/W))*4)/4;cv.width=Math.round(W*R);cv.height=Math.round(H*R);
}
addEventListener('resize',resize);resize();
UI.go('menu');
if(document.fonts&&document.fonts.load)document.fonts.load('20px "Russo One"').catch(()=>{});
requestAnimationFrame(frame);
})();
</script>
